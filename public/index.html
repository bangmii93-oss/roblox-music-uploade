<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uploader.sh — Roblox Music Uploader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: local('JetBrains Mono');
  }

  :root {
    --void: #0a0616;
    --panel: #130a24;
    --panel-alt: #1b0f34;
    --line: #4c2889;
    --line-dim: #2a1650;
    --text: #e6d9ff;
    --dim: #8a6bb8;
    --violet: #b26bff;
    --violet-bright: #d9aeff;
    --ok: #3dffa8;
    --bad: #ff4d7a;
    --warn: #c084fc;
    --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--void);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
  }

  body {
    padding: 28px 16px 60px;
    position: relative;
    overflow-x: hidden;
  }

  #matrixRain {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  .watermark {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    overflow: hidden;
  }
  .watermark span {
    font-size: 16vw;
    font-weight: 700;
    color: var(--violet);
    opacity: 0.14;
    letter-spacing: 0.02em;
    white-space: nowrap;
    text-shadow: 0 0 40px rgba(178,107,255,0.6);
  }

  .page {
    position: relative;
    z-index: 1;
  }

  .brand {
    max-width: 560px;
    margin: 0 auto 18px;
    text-align: center;
  }
  .brand-name {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--violet-bright);
    text-shadow: 0 0 6px rgba(178,107,255,0.8), 0 0 26px rgba(178,107,255,0.5);
    margin: 0;
  }
  .brand-tag {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.25em;
    margin: 6px 0 0;
  }

  .term {
    max-width: 560px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow:
      0 0 0 1px rgba(178,107,255,0.08),
      0 0 40px rgba(120, 40, 220, 0.25),
      0 20px 60px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
  }

  .term::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(178,107,255,0.6), transparent);
    animation: scan 5s linear infinite;
    pointer-events: none;
  }

  @keyframes scan {
    0%   { top: 0%; opacity: 0; }
    5%   { opacity: 1; }
    95%  { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--line-dim);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-dim); }
  .dot.a { background: #5a3a8f; }
  .dot.b { background: #7c4dc9; }
  .dot.c { background: var(--violet); box-shadow: 0 0 6px var(--violet); }
  .titlebar span {
    margin-left: 6px;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.02em;
  }

  .body { padding: 20px 20px 24px; }

  .line { color: var(--dim); font-size: 13px; margin: 0 0 4px; white-space: pre-wrap; }
  .line b { color: var(--violet-bright); font-weight: 500; }
  .prompt { color: var(--ok); }

  h1 {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin: 2px 0 16px;
    letter-spacing: 0.01em;
  }
  h1::before { content: "$ "; color: var(--ok); }
  .cursor {
    display: inline-block;
    width: 8px; height: 15px;
    background: var(--violet-bright);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    vertical-align: -2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .field { margin-top: 18px; }
  .field-label {
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .field-label::before { content: "> "; color: var(--violet); }

  .dropzone {
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    color: var(--dim);
    font-size: 13px;
    background: rgba(178,107,255,0.03);
    transition: border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--violet);
    background: rgba(178,107,255,0.07);
  }
  .dropzone .accent { color: var(--violet-bright); }
  input[type=file] { display: none; }

  input[type=text] {
    width: 100%;
    padding: 9px 10px;
    border-radius: 5px;
    border: 1px solid var(--line-dim);
    background: var(--void);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
  }
  input[type=text]:focus {
    outline: none;
    border-color: var(--violet);
    box-shadow: 0 0 0 2px rgba(178,107,255,0.15);
  }

  .queue { margin-top: 6px; }
  .queue-item {
    border: 1px solid var(--line-dim);
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 10px;
    background: rgba(20, 10, 40, 0.5);
  }
  .queue-item-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .queue-item-name {
    flex: 1;
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .queue-item-size { font-size: 11px; color: var(--dim); }
  .queue-item-remove {
    background: none; border: none; color: var(--dim);
    cursor: pointer; font-size: 14px; padding: 0 4px; margin: 0; width: auto;
  }
  .queue-item-remove:hover { color: var(--bad); }

  .queue-item input[type=text] {
    margin-top: 8px;
    font-size: 12px;
    padding: 7px 9px;
  }

  .preview-audio {
    width: 100%;
    height: 32px;
    margin-top: 10px;
    accent-color: var(--violet);
  }
  .preview-audio::-webkit-media-controls-panel {
    background: var(--void);
  }

  .speed-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--dim);
  }
  .speed-row input[type=range] {
    flex: 1;
    accent-color: var(--violet);
  }
  .speed-val {
    color: var(--violet-bright);
    width: 42px;
    text-align: right;
    flex-shrink: 0;
  }

  .speed-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .mini-btn {
    flex: 1;
    background: rgba(178,107,255,0.08);
    border: 1px solid var(--line-dim);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 7px 8px;
    border-radius: 5px;
    cursor: pointer;
    width: auto;
    margin: 0;
  }
  .mini-btn:hover:not(:disabled) {
    border-color: var(--violet);
    color: var(--violet-bright);
  }
  .mini-btn:disabled { cursor: not-allowed; opacity: 0.5; }
  .mini-btn.applied {
    border-color: var(--ok);
    color: var(--ok);
  }

  .queue-item-status {
    margin-top: 8px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .led { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .led.pending { background: var(--warn); box-shadow: 0 0 6px var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .led.approved { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .led.rejected, .led.error { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  .led.waiting { background: var(--dim); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .status-text.pending { color: var(--warn); }
  .status-text.approved { color: var(--ok); }
  .status-text.rejected, .status-text.error { color: var(--bad); }
  .status-text.waiting { color: var(--dim); }

  .asset-id {
    color: var(--violet-bright);
    user-select: all;
    font-weight: 500;
  }

  .recheck-link {
    background: none; border: none; color: var(--violet-bright);
    text-decoration: underline; cursor: pointer; font-family: var(--mono);
    font-size: 12px; padding: 0; margin: 0; width: auto;
  }

  button.run {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border: 1px solid var(--violet);
    border-radius: 6px;
    background: linear-gradient(180deg, rgba(178,107,255,0.18), rgba(178,107,255,0.08));
    color: var(--violet-bright);
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  button.run:hover:not(:disabled) {
    background: linear-gradient(180deg, rgba(178,107,255,0.3), rgba(178,107,255,0.14));
    box-shadow: 0 0 20px rgba(178,107,255,0.25);
  }
  button.run:disabled {
    border-color: var(--line-dim);
    color: var(--dim);
    background: none;
    cursor: not-allowed;
  }
  button.run::before { content: "$ "; }

  .log {
    margin-top: 16px;
    font-size: 12px;
    color: var(--dim);
    border-top: 1px solid var(--line-dim);
    padding-top: 12px;
    display: none;
  }
  .log.show { display: block; }
  .log div { margin-bottom: 3px; }
</style>
</head>
<body>

<canvas id="matrixRain"></canvas>

<div class="watermark"><span>annisa❤</span></div>

<div class="page">

<div class="brand">
  <p class="brand-name">PACALANK COMMUNITY</p>
  <p class="brand-tag">ROBLOX AUDIO UPLOAD TERMINAL</p>
</div>

<div class="term">
  <div class="titlebar">
    <div class="dot a"></div><div class="dot b"></div><div class="dot c"></div>
    <span>user@roblox — uploader.sh</span>
  </div>

  <div class="body">
    <p class="line">roblox-music-uploader <b>v2.0</b> :: batch mode</p>
    <p class="line" style="margin-bottom:16px;">------------------------------------------</p>

    <h1>select_audio_files<span class="cursor"></span></h1>

    <div class="field">
      <div class="dropzone" id="dropzone">
        <span class="accent">drop files here</span> or click to browse<br>
        <span style="font-size:11px;">mp3 / ogg / wav — bisa pilih banyak sekaligus</span>
      </div>
      <input type="file" id="audioFile" accept="audio/*" multiple>
    </div>

    <div class="queue" id="queue"></div>

    <button class="run" id="uploadBtn" disabled>upload --batch</button>

    <div class="log" id="log"></div>
  </div>
</div>

</div>

<script>
// --- Matrix-style digital rain, warna ungu, di belakang terminal ---
(function() {
  const canvas = document.getElementById('matrixRain');
  const ctx = canvas.getContext('2d');
  let cols, drops, fontSize = 15;

  // Karakter hujan diambil dari nama "PACALANK" sendiri, jadi background
  // keliatan hacker-style tapi tetap kebaca identitas komunitasnya.
  const chars = 'PACALANK';

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / fontSize);
    drops = new Array(cols).fill(0).map(() => Math.random() * -50);
  }
  window.addEventListener('resize', resize);
  resize();

  function draw() {
    ctx.fillStyle = 'rgba(10, 6, 22, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < cols; i++) {
      const char = chars[Math.floor(Math.random() * chars.length)];
      const x = i * fontSize;
      const y = drops[i] * fontSize;

      // kepala tetesan lebih terang, ekor lebih redup ungu
      const isHead = Math.random() > 0.94;
      ctx.fillStyle = isHead ? '#d9aeff' : 'rgba(178, 107, 255, 0.55)';
      ctx.fillText(char, x, y);

      if (y > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 45);
})();
</script>

<script>
const dropzone = document.getElementById('dropzone');
const audioFile = document.getElementById('audioFile');
const queueEl = document.getElementById('queue');
const uploadBtn = document.getElementById('uploadBtn');
const logEl = document.getElementById('log');

// queueFiles: array of { file (File|null kalau dari localStorage), fileName, fileSize,
// displayName, operationId, status, assetId, error }
let queueFiles = [];
let uploading = false;
let pollTimer = null;
let eventSource = null;

const STORAGE_KEY = 'pacalank_upload_queue_v1';

dropzone.addEventListener('click', () => audioFile.click());
['dragenter','dragover'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); })
);
['dragleave','drop'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); })
);
dropzone.addEventListener('drop', e => {
  addFiles(e.dataTransfer.files);
});
audioFile.addEventListener('change', () => {
  addFiles(audioFile.files);
  audioFile.value = '';
});

function addFiles(fileList) {
  for (const file of fileList) {
    queueFiles.push({
      file,
      fileName: file.name,
      fileSize: file.size,
      displayName: file.name.replace(/\.[^/.]+$/, '').slice(0, 50),
      operationId: null,
      status: 'Queued',
      assetId: null,
      error: null,
      previewUrl: URL.createObjectURL(file),
      speed: 1,
      speedApplied: false,
      processing: false
    });
  }
  renderQueue();
  uploadBtn.disabled = queueFiles.length === 0 || uploading;
}

function formatSize(bytes) {
  if (!bytes && bytes !== 0) return '';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

// Simpan cuma metadata yang ringkas & bisa diserialisasi - File object
// sengaja TIDAK disimpan (memang tidak bisa disimpan ke localStorage).
// Ini yang bikin daftar upload tahan direfresh/ditutup tabnya.
function persistQueue() {
  const persistable = queueFiles
    .filter(i => i.operationId) // yang belum keupload (Queued) tak perlu disimpan
    .map(i => ({
      operationId: i.operationId,
      fileName: i.fileName,
      fileSize: i.fileSize,
      displayName: i.displayName,
      status: i.status,
      assetId: i.assetId,
      error: i.error
    }));
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(persistable));
  } catch (e) { /* localStorage penuh/nonaktif, abaikan saja */ }
}

function restoreQueue() {
  let saved = [];
  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch (e) { saved = []; }
  if (saved.length === 0) return;

  queueFiles = saved.map(i => ({ ...i, file: null }));
  renderQueue();
  log(`> memulihkan ${saved.length} riwayat upload dari sesi sebelumnya...`);

  // Ambil snapshot status terkini dulu (siapa tahu berubah selagi tab ditutup),
  // baru setelah itu SSE yang jagain perubahan berikutnya secara realtime.
  refreshSnapshot();
}

async function refreshSnapshot() {
  const ids = queueFiles.filter(i => i.operationId).map(i => i.operationId);
  if (ids.length === 0) return;
  try {
    const res = await fetch('/api/status-batch?ids=' + ids.join(','));
    const data = await res.json();
    queueFiles.forEach(item => {
      const job = data[item.operationId];
      if (job && job.status !== 'NotFound') {
        item.status = job.status;
        item.assetId = job.assetId;
        item.error = job.error;
      }
    });
    renderQueue();
    persistQueue();
  } catch (e) {
    log('> gagal ambil status terakhir: ' + e.message);
  }
}

function renderQueue() {
  queueEl.innerHTML = '';
  queueFiles.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'queue-item';

    const statusClass = statusToClass(item.status);
    const statusLabel = statusToLabel(item);
    const canEdit = !uploading && item.status === 'Queued';

    div.innerHTML = `
      <div class="queue-item-row">
        <div class="queue-item-name">${item.fileName}</div>
        <div class="queue-item-size">${formatSize(item.fileSize)}</div>
        ${canEdit ? `<button class="queue-item-remove" data-idx="${idx}">✕</button>` : ''}
      </div>
      ${canEdit ? `<input type="text" data-idx="${idx}" value="${item.displayName}" placeholder="nama tampilan di Roblox">` : ''}
      ${canEdit && item.previewUrl ? `
        <audio class="preview-audio" data-idx="${idx}" controls preload="metadata" src="${item.previewUrl}"></audio>
        <div class="speed-row">
          <span>speed</span>
          <input type="range" class="speed-slider" data-idx="${idx}" min="0.5" max="1.5" step="0.01" value="${item.speed}">
          <span class="speed-val" data-speedval="${idx}">${item.speed.toFixed(2)}x</span>
        </div>
        <div class="speed-actions">
          <button class="mini-btn apply-speed-btn ${item.speedApplied ? 'applied' : ''}" data-idx="${idx}" ${item.processing ? 'disabled' : ''}>
            ${item.processing ? 'memproses...' : (item.speedApplied ? '✓ speed diterapkan' : 'terapkan speed ke file')}
          </button>
        </div>
      ` : ''}
      ${item.status !== 'Queued' ? `
        <div class="queue-item-status">
          <span class="led ${statusClass}"></span>
          <span class="status-text ${statusClass}">${statusLabel}</span>
          ${item.status === 'AwaitingManualRecheck' ? `<button class="recheck-link" data-idx="${idx}">cek ulang</button>` : ''}
        </div>
      ` : ''}
    `;
    queueEl.appendChild(div);
  });

  queueEl.querySelectorAll('.queue-item-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = queueFiles[Number(btn.dataset.idx)];
      if (item && item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      queueFiles.splice(Number(btn.dataset.idx), 1);
      renderQueue();
      uploadBtn.disabled = queueFiles.length === 0;
    });
  });
  queueEl.querySelectorAll('input[type=text]').forEach(inp => {
    inp.addEventListener('input', () => {
      queueFiles[Number(inp.dataset.idx)].displayName = inp.value;
    });
  });
  queueEl.querySelectorAll('.recheck-link').forEach(btn => {
    btn.addEventListener('click', () => recheckOne(Number(btn.dataset.idx)));
  });

  // Slider speed: langsung ubah playbackRate player preview biar bisa
  // didengar hasilnya real-time sebelum diputuskan mau diterapkan atau tidak.
  queueEl.querySelectorAll('.speed-slider').forEach(slider => {
    slider.addEventListener('input', () => {
      const idx = Number(slider.dataset.idx);
      const item = queueFiles[idx];
      const speed = parseFloat(slider.value);
      item.speed = speed;
      item.speedApplied = false;

      const audioEl = queueEl.querySelector(`.preview-audio[data-idx="${idx}"]`);
      if (audioEl) audioEl.playbackRate = speed;

      const label = queueEl.querySelector(`.speed-val[data-speedval="${idx}"]`);
      if (label) label.textContent = speed.toFixed(2) + 'x';

      const applyBtn = queueEl.querySelector(`.apply-speed-btn[data-idx="${idx}"]`);
      if (applyBtn) {
        applyBtn.textContent = 'terapkan speed ke file';
        applyBtn.classList.remove('applied');
      }
    });
  });

  queueEl.querySelectorAll('.apply-speed-btn').forEach(btn => {
    btn.addEventListener('click', () => applySpeed(Number(btn.dataset.idx)));
  });
}

function statusToClass(status) {
  if (status === 'Approved') return 'approved';
  if (status === 'Rejected' || status === 'Error') return 'error';
  if (status === 'AwaitingManualRecheck') return 'waiting';
  return 'pending';
}
function statusToLabel(item) {
  if (item.status === 'Approved') return `lolos — asset id: ${item.assetId}`;
  if (item.status === 'Rejected') return `ditolak — ${item.error || 'moderasi Roblox'}${item.assetId ? ' (asset id: ' + item.assetId + ')' : ''}`;
  if (item.status === 'Error') return `error — ${item.error || 'unknown'}`;
  if (item.status === 'AwaitingManualRecheck') return `auto-check berhenti sementara, masih diproses roblox${item.assetId ? ' (asset id: ' + item.assetId + ')' : ''}`;
  if (item.status === 'Pending') return `menunggu moderasi roblox...${item.assetId ? ' (asset id: ' + item.assetId + ')' : ' (asset belum dibuat)'}`;
  return item.status;
}

function log(msg) {
  logEl.classList.add('show');
  const line = document.createElement('div');
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

/**
 * Proses ulang file audio secara nyata (bukan cuma preview) sesuai speed
 * yang dipilih di slider. Berguna kalau lagu kena tolak moderasi dan mau
 * dicoba upload ulang dengan tempo yang beda.
 * Teknis: decode -> render ulang lewat OfflineAudioContext dengan playbackRate
 * berbeda -> encode balik jadi WAV -> file itu yang dipakai saat upload.
 */
async function applySpeed(idx) {
  const item = queueFiles[idx];
  if (!item || item.processing) return;
  if (item.speed === 1) {
    log(`> ${item.fileName} — speed 1.00x = file asli, tidak perlu diproses`);
    item.speedApplied = true;
    renderQueue();
    return;
  }

  item.processing = true;
  renderQueue();
  log(`> memproses ${item.fileName} ke speed ${item.speed.toFixed(2)}x...`);

  try {
    const arrayBuffer = await item.file.arrayBuffer();
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await audioCtx.decodeAudioData(arrayBuffer);

    const newLength = Math.ceil(decoded.length / item.speed);
    const offlineCtx = new OfflineAudioContext(decoded.numberOfChannels, newLength, decoded.sampleRate);

    const source = offlineCtx.createBufferSource();
    source.buffer = decoded;
    source.playbackRate.value = item.speed;
    source.connect(offlineCtx.destination);
    source.start(0);

    const rendered = await offlineCtx.startRendering();
    const mp3Blob = audioBufferToMp3Blob(rendered, 128);

    const speedTag = item.speed.toFixed(2) + 'x';
    const baseName = item.fileName.replace(/\.[^/.]+$/, '');
    const newFileName = `${baseName}_${speedTag}.mp3`;
    const newFile = new File([mp3Blob], newFileName, { type: 'audio/mpeg' });

    URL.revokeObjectURL(item.previewUrl);
    item.file = newFile;
    item.fileName = newFileName;
    item.fileSize = newFile.size;
    item.previewUrl = URL.createObjectURL(newFile);
    item.speedApplied = true;
    item.processing = false;

    log(`> ${newFileName} siap - dengarkan preview lalu upload seperti biasa`);
    renderQueue();
  } catch (err) {
    item.processing = false;
    log('> gagal proses speed: ' + err.message);
    renderQueue();
  }
}

/**
 * Encode AudioBuffer jadi MP3 (bukan WAV) pakai lamejs, supaya ukuran file
 * hasil proses speed tetap kecil - sama seperti file MP3 asli, bukan
 * uncompressed PCM yang bisa berkali-kali lipat lebih besar.
 */
function audioBufferToMp3Blob(buffer, kbps = 128) {
  const numChannels = Math.min(buffer.numberOfChannels, 2); // lamejs max 2 channel
  const sampleRate = buffer.sampleRate;
  const encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, kbps);

  const left = floatTo16BitPCM(buffer.getChannelData(0));
  const right = numChannels > 1 ? floatTo16BitPCM(buffer.getChannelData(1)) : null;

  const chunks = [];
  const sampleBlockSize = 1152; // ukuran frame standar mp3

  for (let i = 0; i < left.length; i += sampleBlockSize) {
    const leftChunk = left.subarray(i, i + sampleBlockSize);
    let mp3buf;
    if (right) {
      const rightChunk = right.subarray(i, i + sampleBlockSize);
      mp3buf = encoder.encodeBuffer(leftChunk, rightChunk);
    } else {
      mp3buf = encoder.encodeBuffer(leftChunk);
    }
    if (mp3buf.length > 0) chunks.push(new Uint8Array(mp3buf));
  }

  const finalBuf = encoder.flush();
  if (finalBuf.length > 0) chunks.push(new Uint8Array(finalBuf));

  return new Blob(chunks, { type: 'audio/mpeg' });
}

function floatTo16BitPCM(floatArray) {
  const out = new Int16Array(floatArray.length);
  for (let i = 0; i < floatArray.length; i++) {
    let s = Math.max(-1, Math.min(1, floatArray[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

uploadBtn.addEventListener('click', async () => {
  const pending = queueFiles.filter(i => i.status === 'Queued');
  if (pending.length === 0 || uploading) return;
  uploading = true;
  uploadBtn.disabled = true;
  uploadBtn.textContent = 'uploading...';
  log(`> mengirim ${pending.length} file ke roblox open cloud...`);

  const formData = new FormData();
  pending.forEach(item => formData.append('audio', item.file));
  formData.append('displayNames', JSON.stringify(pending.map(i => i.displayName)));

  try {
    const res = await fetch('/api/upload-batch', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload gagal');

    data.uploaded.forEach(u => {
      const item = pending.find(i => i.fileName === u.fileName && !i.operationId);
      if (item) {
        item.operationId = u.operationId;
        item.status = 'Pending';
      }
    });
    data.failed.forEach(f => {
      const item = pending.find(i => i.fileName === f.fileName && !i.operationId);
      if (item) {
        item.status = 'Error';
        item.error = f.error;
      }
    });

    log(`> ${data.uploaded.length} file diterima roblox, ${data.failed.length} gagal terkirim`);
    renderQueue();
    persistQueue();
    uploading = false;
    uploadBtn.disabled = queueFiles.some(i => i.status === 'Queued') === false;
    uploadBtn.textContent = 'upload --batch';
  } catch (err) {
    log('> gagal upload batch: ' + err.message);
    uploading = false;
    uploadBtn.disabled = false;
    uploadBtn.textContent = 'upload --batch';
  }
});

/**
 * REALTIME: satu koneksi SSE yang dengar SEMUA perubahan status dari server.
 * Begitu Roblox/Studio selesai moderasi (approved/ditolak), server langsung
 * dorong event ini - tidak perlu nunggu giliran polling lagi.
 */
function connectRealtime() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource('/api/events');

  eventSource.onmessage = (e) => {
    let payload;
    try { payload = JSON.parse(e.data); } catch (err) { return; }

    const item = queueFiles.find(i => i.operationId === payload.operationId);
    if (!item) return; // update buat job yang tidak lagi kita lacak di tab ini

    const changed = item.status !== payload.status || item.assetId !== payload.assetId;
    if (changed) {
      if (payload.status === 'Approved') log(`> ${item.fileName} — lolos moderasi (asset id ${payload.assetId})`);
      if (payload.status === 'Rejected') log(`> ${item.fileName} — ditolak moderasi roblox`);
      if (payload.status === 'AwaitingManualRecheck') log(`> ${item.fileName} — auto-check berhenti, cek ulang manual kalau perlu`);
    }

    item.status = payload.status;
    item.assetId = payload.assetId;
    item.error = payload.error;

    renderQueue();
    persistQueue();
  };

  eventSource.onerror = () => {
    // Browser otomatis reconnect EventSource sendiri, cukup catat di log.
    log('> koneksi realtime terputus, mencoba menyambung ulang...');
  };
}

async function recheckOne(idx) {
  const item = queueFiles[idx];
  if (!item || !item.operationId) return;
  log(`> cek ulang manual: ${item.fileName}`);

  try {
    const res = await fetch(`/api/recheck/${item.operationId}`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Recheck gagal');

    item.status = data.status;
    item.assetId = data.assetId;
    item.error = data.error;
    renderQueue();
    persistQueue();
  } catch (err) {
    log('> gagal cek ulang: ' + err.message);
  }
}

// Boot: sambungkan realtime dulu, baru pulihkan riwayat upload kalau ada.
connectRealtime();
restoreQueue();
</script>
